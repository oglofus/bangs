name: Bug report
description: Report a reproducible problem with Oglofus Bangs.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not include secrets or private information.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem in plain language.
      placeholder: The bang redirects to...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps and include a safe example URL or query when useful.
      placeholder: |
        1. Start the worker with...
        2. Request...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, browser, runtime, deployment target, and commit/version when relevant.
      placeholder: Ubuntu 24.04, Firefox 140, local Wrangler, commit...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove secrets and personal data. Describe images in text when they carry important information.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and removed secrets or private information.
          required: true
        - label: This report is not a security vulnerability or accessibility barrier that needs a dedicated report path.
          required: true
